<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Recovery Orchestrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100 font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Revenue Recovery Dashboard</h1>
        
        <!-- Analytics Section -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500">Total Cases</h3>
                <p id="total-cases" class="text-3xl font-bold text-gray-800 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500">At Risk (INR)</h3>
                <p id="total-risk" class="text-3xl font-bold text-red-600 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500">Recovered (INR)</h3>
                <p id="total-recovered" class="text-3xl font-bold text-green-600 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500">Recovery Rate</h3>
                <p id="recovery-rate" class="text-3xl font-bold text-blue-600 mt-2">-</p>
            </div>
        </div>

        <!-- Cases Table -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-800">Recent Cases</h2>
                <button onclick="loadData()" class="text-sm bg-blue-600 hover:bg-blue-700 text-white py-1 px-3 rounded">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
                            <th class="px-6 py-3 border-b font-medium">ID</th>
                            <th class="px-6 py-3 border-b font-medium">Customer</th>
                            <th class="px-6 py-3 border-b font-medium">Type</th>
                            <th class="px-6 py-3 border-b font-medium">Amount (INR)</th>
                            <th class="px-6 py-3 border-b font-medium">Status</th>
                            <th class="px-6 py-3 border-b font-medium">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cases-body" class="text-gray-700 divide-y divide-gray-200">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Audit Modal -->
    <div id="audit-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800" id="modal-title">Audit Trail</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow" id="audit-content">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        const formatINR = (paise) => (paise / 100).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
        
        const statusColors = {
            'open': 'bg-gray-100 text-gray-800',
            'in_progress': 'bg-blue-100 text-blue-800',
            'recovered': 'bg-green-100 text-green-800',
            'failed': 'bg-red-100 text-red-800',
            'escalated': 'bg-orange-100 text-orange-800',
            'closed': 'bg-gray-200 text-gray-600'
        };

        async function loadData() {
            try {
                const [analyticsRes, casesRes] = await Promise.all([
                    fetch('/api/v1/analytics'),
                    fetch('/api/v1/cases?limit=20')
                ]);
                
                const analytics = await analyticsRes.json();
                const cases = await casesRes.json();
                
                // Update Analytics
                document.getElementById('total-cases').textContent = analytics.total_cases;
                document.getElementById('total-risk').textContent = formatINR(analytics.total_at_risk_paise);
                document.getElementById('total-recovered').textContent = formatINR(analytics.total_recovered_paise);
                document.getElementById('recovery-rate').textContent = `${analytics.recovery_rate_percent}%`;
                
                // Update Cases
                const tbody = document.getElementById('cases-body');
                tbody.innerHTML = cases.map(c => `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-xs font-mono text-gray-500 truncate max-w-[120px]">${c.id}</td>
                        <td class="px-6 py-4 font-medium">${c.customer_id}</td>
                        <td class="px-6 py-4 text-sm">${c.case_type}</td>
                        <td class="px-6 py-4 font-medium">${formatINR(c.amount_paise)}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${statusColors[c.status] || 'bg-gray-100'}">
                                ${c.status}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="viewAudit('${c.id}')" class="text-blue-600 hover:text-blue-800 text-sm font-medium">View Trail</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load data', err);
            }
        }

        async function viewAudit(caseId) {
            document.getElementById('modal-title').textContent = `Audit Trail: ${caseId.substring(0, 8)}...`;
            document.getElementById('audit-content').innerHTML = '<p class="text-center text-gray-500 py-8">Loading...</p>';
            document.getElementById('audit-modal').classList.add('active');
            
            try {
                const res = await fetch(`/api/v1/cases/${caseId}/audit`);
                const logs = await res.json();
                
                if (logs.length === 0) {
                    document.getElementById('audit-content').innerHTML = '<p class="text-gray-500">No audit logs found.</p>';
                    return;
                }
                
                document.getElementById('audit-content').innerHTML = `
                    <div class="relative border-l-2 border-blue-200 ml-4 space-y-6">
                        ${logs.map(log => `
                            <div class="relative pl-6">
                                <div class="absolute w-4 h-4 bg-blue-500 rounded-full -left-[9px] top-1 border-2 border-white shadow"></div>
                                <div class="bg-gray-50 rounded p-4 border border-gray-100">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="font-bold text-sm text-blue-800">${log.action_type}</span>
                                        <span class="text-xs text-gray-500">${new Date(log.created_at).toLocaleString()}</span>
                                    </div>
                                    <p class="text-gray-800 text-sm mb-1">${log.description}</p>
                                    ${log.reasoning ? `<p class="text-gray-600 text-xs italic mt-2 bg-white p-2 rounded border border-gray-200 border-l-2 border-l-blue-400">"${log.reasoning}"</p>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                document.getElementById('audit-content').innerHTML = '<p class="text-red-500">Failed to load audit logs.</p>';
            }
        }

        function closeModal() {
            document.getElementById('audit-modal').classList.remove('active');
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('audit-modal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Load initially
        loadData();
    </script>
</body>
</html>
