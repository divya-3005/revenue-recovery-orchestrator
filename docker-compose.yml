version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenue_recovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/revenue_recovery
      - INNGEST_API_BASE_URL=http://host.docker.internal:8288
      - INNGEST_EVENT_API_BASE_URL=http://host.docker.internal:8288
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: bash -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  postgres_data:
