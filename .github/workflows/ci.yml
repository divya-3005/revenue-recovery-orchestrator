name: CI

on:
  push:
    branches: [ main, task-fixes ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revenue_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/revenue_recovery
        run: |
          cd backend
          alembic upgrade head
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/revenue_recovery
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/revenue_recovery
          GEMINI_API_KEY: mock
          GROQ_API_KEY: mock
          ANTHROPIC_API_KEY: mock
        run: |
          cd backend
          pytest -v

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Run Next.js lint
        run: |
          cd frontend
          npm run lint
